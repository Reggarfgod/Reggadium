modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://reggarf-mods.vercel.app/"
logoFile = "logo.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "embeddium"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "sodium"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "create"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "CLIENT"
