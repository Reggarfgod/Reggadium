plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-1.21.1"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include common sources & resources
sourceSets.main.java {
    srcDir 'src/main/java'
    srcDir file('../common/src/main/java')
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir file('../common/src/main/resources')
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

configurations {
    modRuntime {
        transitive = false
    }
}

dependencies {
    // Embeddium (optional, compile-only)
    compileOnly "maven.modrinth:embeddium:1.0.15+mc1.21.1"

    // Sodium API (optional, compile-only)
    compileOnly "net.caffeinemc:sodium-neoforge-api:0.8.13+mc1.21.1"

    // Create Mod for Minecraft 1.21.1
    compileOnly "com.simibubi.create:create-1.21.1:6.0.5-84"

    // Flywheel API
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.1-11"

    // Catnip
    compileOnly "net.createmod.catnip:Catnip-NeoForge-1.21.1:0.8.54"

    // Ponder API
    compileOnly "net.createmod.ponder:Ponder-NeoForge-1.21.1:1.0.46"

    // Runtime mods for runClient
    modRuntime "maven.modrinth:embeddium:1.0.15+mc1.21.1"
    modRuntime "maven.modrinth:create:1.21.1-6.0.5"

    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.4.1'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.4.1'
}

tasks.register('setupRunMods', Copy) {
    from configurations.modRuntime
    into 'run/mods'
}

tasks.named('prepareClientRun') {
    dependsOn 'setupRunMods'
}

processResources {
    var replaceProperties = [
            minecraft_version            : minecraft_version,
            minecraft_version_range      : minecraft_version_range,
            neo_version                  : neo_version,
            neo_version_range            : neo_version_range,
            neoforge_version             : neo_version,
            loader_version_range         : loader_version_range,
            neoforge_loader_version_range: project.findProperty('neoforge_loader_version_range') ?: loader_version_range,
            mod_id                       : mod_id,
            mod_name                     : mod_name,
            mod_license                  : mod_license,
            license                      : mod_license,
            mod_version                  : mod_version,
            version                      : mod_version,
            mod_authors                  : mod_authors,
            mod_author                   : mod_authors,
            mod_description              : mod_description,
            description                  : mod_description,
            credits                      : credits
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
