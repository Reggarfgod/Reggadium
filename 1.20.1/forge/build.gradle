plugins {
    id 'dev.architectury.loom' version '1.13.468'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-forge-1.20.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version_1_20 as int)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version_1_20 as int
}

def java17Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(project.java_version_1_20 as int)
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = java17Launcher
}

sourceSets.main.java {
    srcDir 'src/main/java'
    srcDir file('../common/src/main/java')
}

sourceSets.main.resources {
    srcDir file('../common/src/main/resources')
}

loom {
    silentMojangMappingsLicense()

    forge {
        mixinConfig "${mod_id}.mixins.json"
        mixinConfig "${mod_id}.forge.mixins.json"
    }
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    flatDir {
        dirs 'libs'
    }
    mavenCentral()
    maven { url = "https://maven.minecraftforge.net/" }
    maven { url = "https://api.modrinth.com/maven" }
    maven {
        name = "Create Mod Maven"
        url = "https://maven.createmod.net"
    }
    maven {
        name = "CaffeineMC"
        url = "https://maven.caffeinemc.net/releases"
    }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version_1_20}"
    mappings loom.officialMojangMappings()
    forge "net.minecraftforge:forge:${minecraft_version_1_20}-${forge_version_1_20}"

    // Embeddium (optional, compile-only)
    modCompileOnly "maven.modrinth:embeddium:0.3.31+mc1.20.1"

    // Create Mod for Minecraft 1.20.1 (compile-only)
    modCompileOnly("com.simibubi.create:create-1.20.1:6.0.5-120:slim") { transitive = false }
    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-1.20.1:1.0.6") { transitive = false }
    modCompileOnly("net.createmod.catnip:Catnip-Forge-1.20.1:0.8.44") { transitive = false }
    modCompileOnly("net.createmod.ponder:Ponder-Forge-1.20.1:1.0.92") { transitive = false }

    // Runtime mods for runClient
    modLocalRuntime "maven.modrinth:embeddium:0.3.31+mc1.20.1"
    modLocalRuntime "curse.maven:create-328085:5838779"
    modLocalRuntime name: "flywheel-forge-1.20.1-0.6.11-13"
    modLocalRuntime name: "Registrate-MC1.20-1.3.3"

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation("io.github.llamalad7:mixinextras-forge:0.4.1")
    modImplementation("io.github.llamalad7:mixinextras-forge:0.4.1")
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
        ])
    }
}

processResources {
    var replaceProperties = [
            minecraft_version          : minecraft_version_1_20,
            forge_version              : forge_version_1_20,
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_version                : mod_version,
            version                    : mod_version,
            mod_authors                : mod_authors,
            mod_author                 : mod_authors,
            mod_description            : mod_description,
            description                : mod_description,
            mod_license                : mod_license,
            license                    : mod_license
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}
