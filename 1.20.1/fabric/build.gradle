plugins {
    id 'dev.architectury.loom' version '1.13.468'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-fabric-1.20.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version_1_20 as int)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version_1_20 as int
}

def java17Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(project.java_version_1_20 as int)
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = java17Launcher
}

sourceSets.main.java {
    srcDir 'src/main/java'
    srcDir file('../common/src/main/java')
}

sourceSets.main.resources {
    srcDir 'src/main/resources'
    srcDir file('../common/src/main/resources')
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://api.modrinth.com/maven" }
    maven {
        name = "Create Mod Maven"
        url = "https://maven.createmod.net"
    }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version_1_20}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version_1_20}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_1_20}"
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version_1_20}"
    modLocalRuntime "com.terraformersmc:modmenu:${modmenu_version_1_20}"

    // Sodium (runtime & implementation)
    modImplementation "curse.maven:sodium-394468:6260639"
    // Embeddium (modCompileOnly so Loom remaps class_2960 to ResourceLocation)
    modCompileOnly "curse.maven:embeddium-908741:5522040"

    // Create Mod for Minecraft 1.20.1
    compileOnly("com.simibubi.create:create-1.20.1:6.0.5-120:slim") { transitive = false }

    // Flywheel API
    compileOnly("dev.engine-room.flywheel:flywheel-forge-api-1.20.1:1.0.6") { transitive = false }

    // Catnip
    compileOnly("net.createmod.catnip:Catnip-Forge-1.20.1:0.8.44") { transitive = false }

    // Ponder API
    compileOnly("net.createmod.ponder:Ponder-Forge-1.20.1:1.0.92") { transitive = false }

    // Runtime mods for runClient
    modLocalRuntime "maven.modrinth:indium:1.0.36+mc1.20.1"

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation("io.github.llamalad7:mixinextras-fabric:0.4.1")
    annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.4.1")
}

loom {
    def aw = file("../common/src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            vmArg("-Dsodium.checks.issue2561=false")
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

processResources {
    var replaceProperties = [
            minecraft_version    : minecraft_version_1_20,
            fabric_loader_version: fabric_loader_version_1_20,
            java_version         : java_version_1_20,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_version          : mod_version,
            version              : mod_version,
            mod_authors          : mod_authors,
            mod_author           : mod_authors,
            mod_description      : mod_description,
            description          : mod_description,
            mod_license          : mod_license,
            license              : mod_license
    ]
    inputs.properties replaceProperties
    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties
    }
}
