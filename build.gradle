plugins {
    id 'base'
}

allprojects {
    group = project.findProperty('mod_group_id') ?: 'com.reggarf.mods'
    version = project.findProperty('mod_version') ?: '1.1-beta'

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = "https://cursemaven.com" }
        maven {
            name = "Create Mod Maven"
            url = "https://maven.createmod.net"
        }
        maven {
            name = "CaffeineMC"
            url = "https://maven.caffeinemc.net/releases"
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
    }
}
