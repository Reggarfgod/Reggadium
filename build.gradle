plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "Create Mod Maven"
        url = "https://maven.createmod.net"
    }
    maven {
        name = "CaffeineMC"
        url = "https://maven.caffeinemc.net/releases"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    modRuntime {
        transitive = false
    }
}

dependencies {
    // Embeddium dependency (NeoForge 1.21.1)
    compileOnly "maven.modrinth:embeddium:1.0.15+mc1.21.1"

    // Sodium API (NeoForge 1.21.1)
    compileOnly "net.caffeinemc:sodium-neoforge-api:0.8.13+mc1.21.1"

    // Create Mod for Minecraft 1.21.1
    compileOnly "com.simibubi.create:create-1.21.1:6.0.5-84"

    // Flywheel API (for TransformStack used by Catnip SuperByteBuffer)
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.1-11"

    // Catnip (Create's rendering library containing SuperByteBuffer)
    compileOnly "net.createmod.catnip:Catnip-NeoForge-1.21.1:0.8.54"

    // Ponder API (required by Create block entities hierarchy)
    compileOnly "net.createmod.ponder:Ponder-NeoForge-1.21.1:1.0.46"

    // Runtime mods automatically loaded into run/mods during runClient
    modRuntime "maven.modrinth:embeddium:1.0.15+mc1.21.1"
    modRuntime "maven.modrinth:create:1.21.1-6.0.5"
}

tasks.register('setupRunMods', Copy) {
    from configurations.modRuntime
    into 'run/mods'
}

tasks.named('prepareClientRun') {
    dependsOn 'setupRunMods'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
